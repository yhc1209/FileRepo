<div class="auth-card">
  <h2>📝 註冊帳號</h2>
  <p class="subtitle">建立新帳號以開始使用 FileRepo</p>

  @if (errorMessage()) {
    <div class="alert alert-error">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="username">使用者名稱</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="例如: john_doe"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">電子郵件</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="例如: user@example.com"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">密碼 (至少 6 個字元)</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="請輸入密碼"
        required
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">再次輸入密碼</label>
      <input
        id="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="請再次輸入密碼"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
      {{ isLoading() ? '註冊中...' : '建立帳號' }}
    </button>

    <div class="auth-footer">
      已有帳號？ <a routerLink="/login">返回登入</a>
    </div>
  </form>
</div>
